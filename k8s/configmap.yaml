apiVersion: v1
kind: ConfigMap
metadata:
  name: agentops-config
  labels:
    app.kubernetes.io/name: agentops
data:
  AGENTOPS_MODE: "mock"
  AGENTOPS_SEARCH_CACHE_DIR: "/home/agentops/.agentops-cache/search"
  AUDIT_DB_PATH: "/var/lib/agentops/audit.sqlite"
  BUDGET_TOKEN_LIMIT: "100000"
  QUALITY_GATE_MAX_REVISIONS: "2"
  MAX_RECOVERY_ATTEMPTS: "2"
  RESEARCHER_TIMEOUT_SECS: "30"
  TRACING_ENABLED: "true"
  PHOENIX_ENDPOINT: ""
  LANGSMITH_ENABLED: "false"
