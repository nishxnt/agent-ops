apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-api-gateway
  labels:
    app.kubernetes.io/name: agentops
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops
        app.kubernetes.io/component: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: agentops-api:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUDIT_DB_PATH
              value: /var/lib/agentops/audit.sqlite
          envFrom:
            - configMapRef:
                name: agentops-config
            - secretRef:
                name: agentops-secrets
          volumeMounts:
            - name: audit-log
              mountPath: /var/lib/agentops
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: audit-log
          persistentVolumeClaim:
            claimName: agentops-audit-pvc
