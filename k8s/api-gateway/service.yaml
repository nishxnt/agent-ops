apiVersion: v1
kind: Service
metadata:
  name: agentops-api-gateway
  labels:
    app.kubernetes.io/name: agentops
    app.kubernetes.io/component: api-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agentops
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
