[project]
name = "agentops"
version = "0.1.0"
description = "Production-oriented multi-agent research workflow infrastructure."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nishant Gupta" }]
dependencies = [
    "arize-phoenix>=4.0,<5",
    "deepeval>=4.0.5",
    "diskcache>=5.6",
    "faiss-cpu>=1.8",
    "fastapi>=0.115,<1",
    "groq>=0.9",
    "httpx>=0.27,<1",
    "langgraph>=0.3",
    "ollama>=0.3",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "ragas>=0.4.3",
    "rogue-llm",
    "sentence-transformers>=5.4,<5.5",
    "structlog>=24.4",
    "tavily-python>=0.7.25",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agentops-api = "agentops.api.serve:main"
agentops-mock = "agentops.dev.run_mock_pipeline:main"
agentops-run = "agentops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
rogue-llm = { path = "../rogue-llm", editable = true }
