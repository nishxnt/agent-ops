name: docker-smoke

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: docker build + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout agent-ops
        uses: actions/checkout@v4
        with:
          path: agent-ops

      - name: Checkout rogue-llm (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: nishxnt/rogue-llm
          path: rogue-llm
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: agent-ops
          file: agent-ops/docker/api.Dockerfile
          tags: agentops-api:pytest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: agent-ops/uv.lock

      - name: Sync dependencies
        working-directory: agent-ops
        run: uv sync --frozen

      - name: Run container smoke tests
        working-directory: agent-ops
        run: uv run pytest tests/integration/test_docker_smoke.py -v

      - name: Image size
        if: always()
        run: |
          docker images agentops-api --format "table {{.Tag}}\t{{.Size}}\t{{.CreatedAt}}"
