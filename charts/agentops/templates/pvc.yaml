{{- if .Values.audit.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentops.fullname" . }}-audit
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.audit.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.audit.persistence.size }}
  {{- with .Values.audit.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
