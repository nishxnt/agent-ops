apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentops.fullname" . }}
  labels:
    {{- include "agentops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agentops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "agentops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUDIT_DB_PATH
              value: /var/lib/agentops/audit.sqlite
          envFrom:
            - configMapRef:
                name: {{ include "agentops.fullname" . }}-config
            {{- if .Values.secrets.create }}
            - secretRef:
                name: {{ include "agentops.fullname" . }}-secrets
            {{- end }}
          {{- if .Values.audit.persistence.enabled }}
          volumeMounts:
            - name: audit-log
              mountPath: /var/lib/agentops
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
      {{- if .Values.audit.persistence.enabled }}
      volumes:
        - name: audit-log
          persistentVolumeClaim:
            claimName: {{ include "agentops.fullname" . }}-audit
      {{- end }}
