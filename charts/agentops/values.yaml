# Default values for agentops. Override via -f values.dev.yaml or --set.

image:
  repository: agentops-api
  tag: "" # empty = use Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000
  nodePort: null # only honored when type=NodePort

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: 1000m

audit:
  dbPath: "/var/lib/agentops/audit.sqlite"
  mountPath: "/var/lib/agentops"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "" # empty = cluster default
    accessMode: ReadWriteOnce

config:
  agentopsMode: "mock"
  searchCacheDir: "/home/agentops/.agentops-cache/search"
  budgetTokenLimit: "100000"
  qualityGateMaxRevisions: "2"
  maxRecoveryAttempts: "2"
  researcherTimeoutSecs: "30"
  tracingEnabled: "true"
  phoenixEndpoint: ""
  langsmithEnabled: "false"

# Secrets are populated via `kubectl create secret`, not this file.
# See README for the recommended workflow.
secrets:
  create: false # whether to install the placeholder secret
  groqApiKey: ""
  langsmithApiKey: ""

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
